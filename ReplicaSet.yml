apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: myapp-replicaset
  labels:
    name: nginx
    type: front-end
spec:
  template:
    metadata:
      name: my-replicaset
      labels:
        name: nginx
        type: front-end
    spec:
      containers:
      - name: nginx-container
        image: nginx
  replicas: 3
  selector:
    matchLabels:
      type: front-end
    
